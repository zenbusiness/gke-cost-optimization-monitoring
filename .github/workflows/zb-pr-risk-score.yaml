---
# UDON Managed Pipeline
# https://engineering.zenbusiness.team/docs/default/component/core-pipeline-actions/workflows/pr-risk-scorer/
name: PR Risk Score
on:
  pull_request:
    types:
      - opened
      - ready_for_review
  issue_comment:
    types:
      - created

jobs:
  assess:
    name: assess
    # Runs only when a PR was opened directly as ready-for-review, or moved from
    # draft to ready-for-review, or on the /pr-risk comment. Does not run on every push.
    if: >
      (
        github.event_name == 'pull_request' &&
        (
          (github.event.action == 'opened' && github.event.pull_request.draft == false) ||
          github.event.action == 'ready_for_review'
        ) &&
        !contains(github.actor, '[bot]')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/pr-risk')
      )
    uses: zenbusiness/core-pipeline-actions/.github/workflows/pr-risk-scorer.yaml@v4
    secrets: inherit
